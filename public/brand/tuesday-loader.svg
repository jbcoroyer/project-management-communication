<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" overflow="visible"><title>Chargement</title><style>rect{transform-box:fill-box;transform-origin:50% 100%;animation:s 1.8s cubic-bezier(.3,0,.2,1) infinite both}.b2{animation-delay:.1s}.b3{animation-delay:.2s}.b4{animation-delay:.38s}@keyframes s{0%{transform:translateY(-40px);opacity:0}15%{opacity:1}25%{transform:translateY(0) scaleY(1)}30%{transform:translateY(0) scaleY(.88)}36%{transform:none}80%{transform:none;opacity:1}100%{transform:none;opacity:0}}@media (prefers-reduced-motion:reduce){rect{animation:none}}</style><rect class="b4" fill="#C4532F" x="35" y="50" width="26" height="26" rx="7"/><rect fill="#1E1A16" x="5" y="20" width="26" height="26" rx="7"/><rect class="b2" fill="#1E1A16" x="35" y="20" width="26" height="26" rx="7"/><rect class="b3" fill="#1E1A16" x="65" y="20" width="26" height="26" rx="7"/></svg>
